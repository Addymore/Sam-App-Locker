name: Sam App Locker CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Give permission to executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.1

      - name: Build with gradle
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease

      - name: Upload debug apks
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-debug
          path: plus/app/build/outputs/apk/debug

      - name: Upload release apks
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-release-unsigned
          path: plus/app/build/outputs/apk/release
